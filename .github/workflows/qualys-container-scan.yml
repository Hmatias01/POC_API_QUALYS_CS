jobs:
  qualys-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ADICIONE ESTE PASSO: Construir a imagem localmente para que o scanner a encontre
      - name: Build local image
        run: docker build -t poc-api-matias:latest .

      - name: Run Qualys Container Security Scan
        env:
          QUALYS_ACCESS_TOKEN: ${{ secrets.QUALYS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALYS_POD: US3
          IMAGE_NAME: poc-api-matias
          IMAGE_TAG: latest
          POLICY_TAGS: "POC_API_MATIAS"
        run: |
          chmod +x .github/qualys_container_scan.sh
          ./.github/qualys_container_scan.sh
